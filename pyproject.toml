[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kcat"
version = "0.1.0"
description = "K-CAT 99.9 — a procedural lofi radio: synthesized songs from deterministic seeds, a Moog-hearted engine, and a cat named Nine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.scripts]
kcat = "kcat.__main__:main"

[tool.setuptools]
packages = ["kcat"]

# Lint: ruff (pip install ruff, or pipx run ruff). The codebase is
# stdlib-flavoured and hand-formatted; the config meets it where it
# lives rather than reformatting the world: pyflakes + import order
# + the pycodestyle errors that signal real mistakes.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
